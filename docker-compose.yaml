services:
  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:18.4
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tinkertaps}

    # Do NOT expose PostgreSQL to the host in production.
    # API reaches it using: postgres:5432
    # ================== For Development Only ==================
    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-tinkertaps}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:8.8
    restart: unless-stopped

    # Do NOT expose Redis to the host in production.
    # API reaches it using: redis:6379

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # FastAPI Backend
  # ============================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      DB_PORT: 5432

      REDIS_HOST: redis
      REDIS_PORT: 6379

    expose:
      - "8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - edge
      - backend

  # ============================================================
  # Astro Frontend
  # ============================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile

    restart: unless-stopped

    # Astro normally listens on 4321.
    expose:
      - "4321"

    depends_on:
      - api

    networks:
      - edge

    stop_grace_period: 2s

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "80:80"
      # Later:
      # - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - web
      - api

    networks:
      - edge

  # ============================================================
  # Floci - Local AWS Emulator
  # ============================================================
  floci:
    image: floci/floci:latest
    restart: unless-stopped

    environment:
      FLOCI_STORAGE_MODE: hybrid
      FLOCI_PERSISTENT_PATH: /app/data
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://floci:4566

    ports:
      - "4566:4566"

    volumes:
      - floci_data:/app/data

    networks:
      - backend
      - floci-external


# ==============================================================
# Volumes
# ==============================================================
volumes:
  postgres_data:
  floci_data:


# ==============================================================
# Networks
# ==============================================================
networks:

  # Nginx <-> Web <-> API
  edge:
    driver: bridge

  # API <-> PostgreSQL <-> Redis
  backend:
    driver: bridge
    internal: true

  # Floci External
  floci-external:
    driver: bridge
